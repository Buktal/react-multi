[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "react-m"
version = "0.1.0"
description = "A small, dependency-aware multi-action ReAct research implementation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Buktal"}]
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5"]
keywords = ["react", "llm", "agents", "tool-calling", "parallel-execution"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11", "mypy>=1.15", "types-jsonschema", "build"]

[project.scripts]
react-m = "react_m.cli:main"

[project.urls]
Repository = "https://github.com/Buktal/ReAct-M"
Issues = "https://github.com/Buktal/ReAct-M/issues"
Changelog = "https://github.com/Buktal/ReAct-M/blob/main/CHANGELOG.md"
Releases = "https://github.com/Buktal/ReAct-M/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/react_m"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/react_m"]
check_untyped_defs = true
disallow_untyped_defs = true
