name: Usage question
description: Ask about setup, tools, action batches or experiment results.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to do and where you need help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the version, relevant command or minimal example. Remove credentials and private data.
